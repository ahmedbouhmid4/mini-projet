<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - HighTechStore</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <header class="entete">
    <div class="logo">
      <span class="logo-icone">HTS</span>
      <span>HighTechStore</span>
    </div>
    <nav>
      <ul class="menu">
        <li><a href="../index.html">Accueil</a></li>
        <li><a href="pc.html">PC</a></li>
        <li><a href="inscription.html" class="actif">Inscription</a></li>
        <li><a href="infos.html">Infos</a></li>
        <li><a href="promos.html">Promos</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenu">
    <section class="carte">
      <h2>Formulaire d'Inscription</h2>
      <form class="formulaire" action="#" method="post">
        <div class="champ">
          <label for="nom">Nom :</label>
          <input type="text" id="nom" name="nom" required>
        </div>
        <div class="champ">
          <label for="prenom">Prénom :</label>
          <input type="text" id="prenom" name="prenom" required>
        </div>
        <div class="champ">
          <label for="naissance">Date de naissance :</label>
          <input type="date" id="naissance" name="naissance" required>
        </div>
        <div class="champ">
          <span class="groupe-titre">Sexe :</span>
          <div class="radios">
            <label><input type="radio" name="sexe" value="M" checked required> Masculin</label>
            <label><input type="radio" name="sexe" value="F"> Féminin</label>
          </div>
        </div>
        <div class="champ">
          <label for="adresse">Adresse :</label>
          <input type="text" id="adresse" name="adresse" required>
        </div>
        <div class="champ">
          <label for="cp">Code postal :</label>
          <input type="text" id="cp" name="cp" pattern="[0-9]{4}" maxlength="4" required>
        </div>
        <div class="champ">
          <label for="ville">Ville :</label>
          <input type="text" id="ville" name="ville" required>
        </div>
        <div class="champ">
          <label for="gouvernorat">Gouvernorat :</label>
          <select id="gouvernorat" name="gouvernorat" required>
            <option value="">-- Choisir un gouvernorat --</option>
          <option value="Ariana">Ariana</option>
          <option value="Béja">Béja</option>
          <option value="Ben Arous">Ben Arous</option>
          <option value="Bizerte">Bizerte</option>
          <option value="Gabès">Gabès</option>
          <option value="Gafsa">Gafsa</option>
          <option value="Jendouba">Jendouba</option>
          <option value="Kairouan">Kairouan</option>
          <option value="Kasserine">Kasserine</option>
          <option value="Kébili">Kébili</option>
          <option value="Le Kef">Le Kef</option>
          <option value="Mahdia">Mahdia</option>
          <option value="La Manouba">La Manouba</option>
          <option value="Médenine">Médenine</option>
          <option value="Monastir">Monastir</option>
          <option value="Nabeul">Nabeul</option>
          <option value="Sfax">Sfax</option>
          <option value="Sidi Bouzid">Sidi Bouzid</option>
          <option value="Siliana">Siliana</option>
          <option value="Sousse">Sousse</option>
          <option value="Tataouine">Tataouine</option>
          <option value="Tozeur">Tozeur</option>
          <option value="Tunis">Tunis</option>
          <option value="Zaghouan">Zaghouan</option>
          </select>
        </div>
        <div class="champ">
          <label for="fonction">Fonction :</label>
          <input type="text" id="fonction" name="fonction">
        </div>
        <div class="champ">
          <label for="email">Adresse E-mail :</label>
          <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
        </div>
        <div class="champ">
          <label for="tel">Numéro de téléphone :</label>
          <input type="tel" id="tel" name="tel" pattern="[0-9]{8}" maxlength="8" required>
        </div>
        <div class="champ champ-large">
          <label for="remarques">Remarques :</label>
          <textarea id="remarques" name="remarques" placeholder="Vos remarques ou précisions..."></textarea>
        </div>
        <div class="champ-large">
          <button type="submit" class="bouton">Valider l'inscription</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="pied">
    <p>&copy; 2026 HighTechStore - Tous droits réservés | Auteur : Votre nom et prénom</p>
  </footer>
</body>
</html>
